<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CI.TECH — Login</title>
<style>
  :root{
    --bg:#070a1f; --panel:#0d1230; --panel2:#121a3f;
    --blue:#2aa9ff; --blue2:#1565ff; --text:#eef2ff; --muted:#8d97c4; --border:#243068;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 0%, #0d1540 0%, var(--bg) 60%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:20px;
  }
  form{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:32px 28px;
    width:100%;
    max-width:360px;
  }
  h1{font-size:19px; margin:0 0 4px; text-align:center;}
  h1 span{color:var(--blue);}
  p.sub{color:var(--muted); font-size:13px; text-align:center; margin:0 0 24px;}
  label{font-size:12.5px; color:var(--muted); display:block; margin-bottom:6px;}
  input{
    width:100%;
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:10px;
    padding:12px 14px;
    font-size:14px;
    margin-bottom:16px;
  }
  button{
    width:100%;
    appearance:none; border:none; border-radius:12px;
    padding:13px; font-size:15px; font-weight:600; cursor:pointer;
    color:#fff;
    background:linear-gradient(135deg,var(--blue),var(--blue2));
  }
  button:active{transform:translateY(1px);}
  .error{
    color:#ff6b6b;
    font-size:13px;
    text-align:center;
    margin:-8px 0 16px;
    min-height:16px;
  }
</style>
</head>
<body>
<form id="loginForm">
  <h1>CI.TECH <span>·</span> Posts</h1>
  <p class="sub">Entre pra acessar o gerador e a galeria</p>
  <div class="error" id="errorMsg"></div>
  <label for="username">Usuário</label>
  <input id="username" name="username" autocomplete="username" required>
  <label for="password">Senha</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Entrar</button>
</form>
<script>
const form = document.getElementById('loginForm');
const errorMsg = document.getElementById('errorMsg');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorMsg.textContent = '';
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  try {
    const resp = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await resp.json();
    if (!resp.ok) { errorMsg.textContent = data.error || 'Erro ao entrar'; return; }
    const params = new URLSearchParams(location.search);
    location.href = params.get('next') || '/';
  } catch (err) {
    errorMsg.textContent = 'Não consegui conectar ao servidor.';
  }
});
</script>
</body>
</html>
