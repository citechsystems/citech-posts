name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    name: Build & Deploy citech-posts
    runs-on: [self-hosted, citech-posts]
    steps:
      - name: Atualizar e subir o container
        run: |
          cd /home/citech/projects/citech-posts
          git fetch origin main
          git reset --hard origin/main
          # O processo do runner não carrega o grupo "docker" na sessão (fica
          # desatualizado desde que o serviço systemd --user foi criado, mesmo
          # o usuário já sendo membro do grupo) — `sg docker` relê o grupo na
          # hora, sem depender da sessão herdada.
          sg docker -c "docker compose up -d --build && docker compose ps"

      - name: Telegram — sucesso
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ *citech-posts — Deploy concluído!*
            📦 Commit: `${{ github.sha }}`
            👤 Por: ${{ github.actor }}
            🌿 Branch: ${{ github.ref_name }}
            🔗 ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

      - name: Telegram — falha
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ *citech-posts — Deploy FALHOU!*
            📦 Commit: `${{ github.sha }}`
            👤 Por: ${{ github.actor }}
            🔗 ${{ github.server_url }}/${{ github.repository }}/actions
