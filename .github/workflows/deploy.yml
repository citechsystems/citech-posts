name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    name: Build & Deploy citech-posts
    runs-on: [self-hosted, citech-posts]
    steps:
      - name: Atualizar e subir o container
        run: |
          cd /home/citech/projects/citech-posts
          git fetch origin main
          git reset --hard origin/main
          # O processo do runner não carrega o grupo "docker" na sessão (fica
          # desatualizado desde que o serviço systemd --user foi criado, mesmo
          # o usuário já sendo membro do grupo) — `sg docker` relê o grupo na
          # hora, sem depender da sessão herdada.
          sg docker -c "docker compose up -d --build && docker compose ps"

      # Notificação via curl direto na API do Telegram em vez de uma action
      # baseada em container Docker — o runner self-hosted também sofre do
      # mesmo problema de grupo "docker" desatualizado (ver comentário acima),
      # mas dessa vez na infraestrutura interna da action, fora do nosso
      # controle via `sg`. curl evita precisar de Docker nesse passo.
      - name: Telegram — sucesso
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="✅ citech-posts — Deploy concluído!\n📦 Commit: ${GITHUB_SHA}\n👤 Por: ${GITHUB_ACTOR}\n🌿 Branch: ${GITHUB_REF_NAME}\n🔗 ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=$(printf '%b' "$MSG")"

      - name: Telegram — falha
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="❌ citech-posts — Deploy FALHOU!\n📦 Commit: ${GITHUB_SHA}\n👤 Por: ${GITHUB_ACTOR}\n🔗 ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=$(printf '%b' "$MSG")"
