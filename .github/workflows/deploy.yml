name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: [self-hosted, citech-posts]
    steps:
      - name: Diagnóstico do ambiente
        run: |
          echo "whoami: $(whoami)"
          echo "HOME: $HOME"
          echo "PWD: $(pwd)"
          echo "PATH: $PATH"
          id
          which git docker || true
      - name: Atualizar e subir o container
        run: |
          set -x
          cd /home/citech/projects/citech-posts
          git fetch origin main
          git reset --hard origin/main
          docker compose up -d --build
          docker compose ps
