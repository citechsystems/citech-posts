services:
  citech-posts:
    build: .
    container_name: citech-posts
    restart: unless-stopped
    ports:
      # porta externa:porta interna — 8091 conferida como livre no
      # tech-server (8090 já era do database-adminer-1). Ajuste se
      # precisar. Se o cloudflared vai apontar direto pro container (rede
      # do Docker), essa porta externa não precisa nem ficar exposta no
      # host — nesse caso é só remover o "ports:" e usar o nome do serviço
      # na network.
      - "8091:3010"
    environment:
      - PORT=3010
      - SQLITE_FILE=/app/data/posts.sqlite
      - UPLOADS_DIR=/app/uploads
    volumes:
      # Caminhos relativos à pasta deste docker-compose.yml — funcionam
      # com qualquer usuário/pasta de deploy, sem precisar ajustar nada.
      - ./data:/app/data
      - ./uploads:/app/uploads
