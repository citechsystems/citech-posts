services:
  citech-posts:
    build: .
    container_name: citech-posts
    restart: unless-stopped
    ports:
      # porta externa:porta interna — 8091 conferida como livre no
      # tech-server (8090 já era do database-adminer-1). Ajuste se
      # precisar. Se o cloudflared vai apontar direto pro container (rede
      # do Docker), essa porta externa não precisa nem ficar exposta no
      # host — nesse caso é só remover o "ports:" e usar o nome do serviço
      # na network.
      - "8091:3010"
    environment:
      - PORT=3010
      - SQLITE_FILE=/app/data/posts.sqlite
      - UPLOADS_DIR=/app/uploads
      # Usuário/senha do primeiro login, criado automaticamente no boot se
      # ainda não existir nenhum usuário no banco. Se ADMIN_PASSWORD não for
      # definida, uma senha aleatória é gerada e impressa uma vez no log
      # (docker compose logs citech-posts) — defina aqui pra controlar a senha
      # inicial, ou deixe em branco e pegue a gerada no log.
      - ADMIN_USERNAME=admin
      # - ADMIN_PASSWORD=
      # Depois de publicar no subdomínio HTTPS (via cloudflared), mude pra
      # "true" — isso faz o cookie de sessão só trafegar por HTTPS. Em "false"
      # (padrão) funciona tanto local quanto atrás do túnel, mas sem essa
      # proteção extra do cookie.
      - COOKIE_SECURE=false
    volumes:
      # Caminhos relativos à pasta deste docker-compose.yml — funcionam
      # com qualquer usuário/pasta de deploy, sem precisar ajustar nada.
      - ./data:/app/data
      - ./uploads:/app/uploads
